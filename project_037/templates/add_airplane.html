{% extends "base.html" %}

{% block content %}

<h1>Add New Airplane</h1>
<p class="subtitle">Register a new airplane in the system</p>

<form method="post">
    <div class="form-grid">
        <div class="form-group">
            <label>Airplane ID</label>
            <input type="text" name="airplane_id" required>
        </div>

        <div class="form-group">
            <label>Purchase Date</label>
            <input type="date" name="purchase_date" required>
        </div>

        <div class="form-group">
            <label>Manufacturer</label>
            <select name="manufacturer" required>
                <option value="">Select</option>
                <option value="Boeing">Boeing</option>
                <option value="Airbus">Airbus</option>
                <option value="Dassault">Dassault</option>
            </select>
        </div>

        <div class="form-group">
            <label>Airplane Size</label>
            <select name="airplane_size" required>
                <option value="">Select</option>
                <option value="small">Small</option>
                <option value="big">Big</option>
            </select>
        </div>
    </div>

    <button type="submit" style="margin-top: 30px;">Add Airplane</button>
</form>


<div style="margin-top: 30px;">
    <a href="/manager_dashboard" style="color:#0F6D6F; font-weight:600;">← Back to Dashboard</a>
</div>

{% endblock %}
