{% extends "base.html" %}

{% block content %}

<h1>Add Flight</h1>
<p class="subtitle">Enter flight details to create a new flight</p>

<form method="post">
    <div class="form-grid">
        <div class="form-group">
            <label>Origin Airport</label>
            <input type="text" name="origin_airport_id" list="airports" placeholder="e.g. TLV" required>
        </div>

        <div class="form-group">
            <label>Destination Airport</label>
            <input type="text" name="destination_airport_id" list="airports" placeholder="e.g. JFK" required>
        </div>

        <div class="form-group">
            <label>Departure Date</label>
            <input type="date" name="departure_date" min="{{ today }}" required>
        </div>

        <div class="form-group">
            <label>Departure Time</label>
            <input type="time" name="departure_time" required>
        </div>
    </div>

    <button type="submit" style="margin-top: 30px;">Continue</button>
</form>

<datalist id="airports">
    {% for airport in airports %}
    <option value="{{ airport }}">
        {% endfor %}
</datalist>


<div style="margin-top: 30px;">
    <a href="/manager_dashboard" style="color:#0F6D6F; font-weight:600;">← Back to Dashboard</a>
</div>

{% endblock %}
