{% extends "base.html" %}

{% block content %}

<h1>Set Ticket Prices</h1>
<p class="subtitle">Define ticket prices for this flight</p>

<form method="POST">
    <div class="form-grid">
        <div class="form-group">
            <label for="economy_price">Economy Class Price</label>
            <input type="number" id="economy_price" name="economy_price" min="0" step="0.01" required
                placeholder="Enter economy ticket price">
        </div>

        {% if airplane_size == "big" %}
        <div class="form-group">
            <label for="business_price">Business Class Price</label>
            <input type="number" id="business_price" name="business_price" min="0" step="0.01" required
                placeholder="Enter business ticket price">
        </div>
        {% endif %}
    </div>

    <button type="submit" style="margin-top: 30px;">Confirm Prices</button>
</form>


<div style="margin-top: 30px;">
    <a href="/manager_dashboard" style="color:#0F6D6F; font-weight:600;">← Back to Dashboard</a>
</div>

{% endblock %}
