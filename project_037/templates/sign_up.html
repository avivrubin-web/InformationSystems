{% extends "base.html" %}

{% block content %}
<h1>Sign Up</h1>

<p class="subtitle">
    Create a new account by filling in the details below.
</p>

<form method="post">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="passport">Passport Number</label>
    <input type="text" id="passport" name="passport" required>

    <div class="form-grid">
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>
    </div>

    <label for="birth_date">Birth Date</label>
    <input type="date" id="birth_date" name="birth_date" required>

    <label>Phone Numbers</label>

    <div id="phones-container" class="phones-container">
        <div class="phone-row">
            <input type="text" name="phone_numbers" placeholder="05XXXXXXXX" required>
            <button type="button" class="add-phone-btn" onclick="addPhoneField()" title="Add phone number">+</button>
        </div>
    </div>

    <small style="color:#666; display:block; margin-bottom:15px;">
        You can add as many phone numbers as you want (10 digits each).
    </small>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Create Account</button>

</form>

<script>
    function addPhoneField() {
        const container = document.getElementById("phones-container");

        // remove + button from previous last row
        const rows = container.getElementsByClassName("phone-row");
        const lastRow = rows[rows.length - 1];
        const lastBtn = lastRow.querySelector(".add-phone-btn");
        if (lastBtn) {
            lastBtn.remove();
        }

        // create new row
        const row = document.createElement("div");
        row.className = "phone-row";

        const input = document.createElement("input");
        input.type = "text";
        input.name = "phone_numbers";
        input.placeholder = "05XXXXXXXX";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "add-phone-btn";
        btn.innerText = "+";
        btn.onclick = addPhoneField;

        row.appendChild(input);
        row.appendChild(btn);
        container.appendChild(row);
    }
</script>

{% endblock %}
